    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const examConfig = window.__APP_DATA__.config;
            const quizData = window.__APP_DATA__.quiz;
            document.getElementById("header-section").innerHTML = "<h1 class=\"text-3xl md:text-5xl font-bold tracking-widest mb-4 text-center\">" + examConfig.schoolName + " " + examConfig.semester + "</h1><h2 class=\"text-xl md:text-3xl text-gray-300 font-semibold w-full\">" + examConfig.examName + "</h2>";
            const numberMap = ["零", "一、", "二、", "三、", "四、"];
            let currentSectionNum = 1;
            const vocabGrid = document.getElementById("vocab-grid");
            if(examConfig.vocabularies && examConfig.vocabularies.length > 0) {
                const section = document.getElementById("vocab-section");
                section.classList.remove("hidden");
                section.querySelector(".section-num").textContent = numberMap[currentSectionNum++];
                examConfig.vocabularies.forEach((v, idx) => {
                    const div = document.createElement("div");
                    div.className = "flex items-center p-4 bg-gray-800 rounded-xl border border-gray-700 hover:border-amber-500 transition-colors w-full flex-wrap gap-4 justify-between";
                    div.innerHTML = "<span class=\"font-medium\">" + (idx + 1) + ". " + v.word + "</span><span class=\"answer-text text-amber-300 font-bold bg-gray-900 px-4 py-2 rounded-lg shadow-inner\">" + v.answer + "</span>";
                    vocabGrid.appendChild(div);
                });
            }
            const typoGrid = document.getElementById("typo-grid");
            if(examConfig.typos && examConfig.typos.length > 0) {
                const section = document.getElementById("typo-section");
                section.classList.remove("hidden");
                section.querySelector(".section-num").textContent = numberMap[currentSectionNum++];
                examConfig.typos.forEach((t, idx) => {
                    const div = document.createElement("div");
                    div.className = "flex items-center p-4 bg-gray-800 rounded-xl border border-gray-700 hover:border-purple-500 transition-colors w-full flex-wrap gap-4 justify-between";
                    div.innerHTML = "<span class=\"font-medium text-left flex-grow break-all leading-relaxed\">" + (idx + 1) + ". " + t.word + "</span><span class=\"answer-text text-purple-300 font-bold bg-gray-900 px-4 py-2 rounded-lg shadow-inner min-w-[60px] text-center\">" + t.answer + "</span>";
                    typoGrid.appendChild(div);
                });
            }
            const questionGrid = document.getElementById("question-grid");
            if(quizData && quizData.length > 0) {
                const section = document.getElementById("quiz-section");
                section.classList.remove("hidden");
                section.querySelector(".section-num").textContent = numberMap[currentSectionNum++];
                quizData.forEach((data, index) => {
                    const btn = document.createElement("div");
                    btn.textContent = data.id;
                    btn.classList.add("question-selector", "text-2xl", "md:text-3xl", "font-bold", "py-3", "md:py-5", "rounded-xl", "text-center", "bg-gray-800", "border", "border-gray-600", "select-none");
                    btn.dataset.index = index;
                    questionGrid.appendChild(btn);
                });
            }
            const modal = document.getElementById("question-modal");
            const modalContent = document.getElementById("question-content");
            const closeModalBtn = document.getElementById("close-modal");
            const questionCard = document.getElementById("question-card");
            const explanationBubble = document.getElementById("global-explanation-bubble");
            const fullscreenModal = document.getElementById("fullscreen-text-modal");
            const fullscreenContent = document.getElementById("fullscreen-text-content");
            const closeFullscreenBtn = document.getElementById("close-fullscreen");
            const qnavPrevBtn = document.getElementById("qnav-prev");
            const qnavNextBtn = document.getElementById("qnav-next");
            const qnavJumpToggleBtn = document.getElementById("qnav-jump-toggle");
            const qnavJumpPanel = document.getElementById("qnav-jump-panel");
            const qnavProgressText = document.getElementById("qnav-progress-text");
            const qnavProgressFill = document.getElementById("qnav-progress-fill");
            const qnavJumpStrip = document.getElementById("qnav-jump-strip");
            let currentOpenIndex = null;
            let questionAnswers = new Array(quizData.length).fill(null);
            let navAnimTimer = null;
            function statusOf(i) { const a = questionAnswers[i]; if (!a) return "unanswered"; return a.isCorrect ? "correct" : "incorrect"; }
            function updateGridButton(i) {
                const selector = document.querySelector(`.question-selector[data-index="${i}"]`);
                if (!selector) return;
                selector.classList.remove("marked-for-review", "bg-gray-800", "bg-emerald-700", "bg-red-700", "border-emerald-500", "border-red-500");
                selector.style.opacity = "";
                const st = statusOf(i);
                if (st === "correct") { selector.classList.add("bg-emerald-700", "border-emerald-500"); selector.style.opacity = "0.9"; }
                else if (st === "incorrect") { selector.classList.add("bg-red-700", "border-red-500"); selector.style.opacity = "0.9"; }
                else { selector.classList.add("bg-gray-800"); }
            }
            function isMarkedForReview(i) {
                const selector = document.querySelector(`.question-selector[data-index="${i}"]`);
                return !!(selector && selector.classList.contains("marked-for-review"));
            }
            function buildJumpStripHTML(currentIndex) {
                return quizData.map((d, i) => {
                    const st = statusOf(i);
                    let cls = "qnav-jump-btn";
                    if (i === currentIndex) cls += " qnav-current";
                    else if (st === "correct") cls += " qnav-correct";
                    else if (st === "incorrect") cls += " qnav-incorrect";
                    else if (isMarkedForReview(i)) cls += " qnav-marked";
                    return `<button type="button" class="${cls}" data-jump="${i}" aria-label="跳到第${d.id}題${isMarkedForReview(i) && st === "unanswered" ? "（已標記待檢討）" : ""}">${d.id}</button>`;
                }).join("");
            }
            function updateFloatingNav(index) {
                const total = quizData.length;
                const pct = total > 1 ? Math.round(((index + 1) / total) * 100) : 100;
                if (qnavPrevBtn) qnavPrevBtn.disabled = index <= 0;
                if (qnavNextBtn) qnavNextBtn.disabled = index >= total - 1;
                if (qnavProgressText) qnavProgressText.textContent = `第 ${index + 1} / ${total} 題`;
                if (qnavProgressFill) qnavProgressFill.style.width = pct + "%";
                if (qnavJumpStrip) qnavJumpStrip.innerHTML = buildJumpStripHTML(index);
            }
            function navigateTo(index, dir, closeJumpPanel) {
                if (index < 0 || index >= quizData.length || index === currentOpenIndex) return;
                modalContent.style.setProperty("--qnav-dir", (dir > 0 ? "12px" : "-12px"));
                modalContent.classList.add("qnav-swap-out");
                if (navAnimTimer) clearTimeout(navAnimTimer);
                navAnimTimer = setTimeout(() => {
                    renderQuestionInto(index);
                    questionCard.scrollTop = 0;
                    explanationBubble.classList.remove("active");
                    modalContent.classList.remove("qnav-swap-out");
                    modalContent.classList.add("qnav-swap-in");
                    setTimeout(() => modalContent.classList.remove("qnav-swap-in"), 200);
                }, 150);
                if (closeJumpPanel && qnavJumpPanel) qnavJumpPanel.classList.remove("active");
            }
            if (qnavPrevBtn) qnavPrevBtn.addEventListener("click", () => { if (currentOpenIndex > 0) navigateTo(currentOpenIndex - 1, -1); });
            if (qnavNextBtn) qnavNextBtn.addEventListener("click", () => { if (currentOpenIndex < quizData.length - 1) navigateTo(currentOpenIndex + 1, 1); });
            if (qnavJumpToggleBtn && qnavJumpPanel) qnavJumpToggleBtn.addEventListener("click", (e) => { e.stopPropagation(); qnavJumpPanel.classList.toggle("active"); });
            if (qnavJumpPanel) qnavJumpPanel.addEventListener("click", (e) => {
                const btn = e.target.closest("[data-jump]");
                if (!btn) return;
                const target = parseInt(btn.dataset.jump, 10);
                if (target !== currentOpenIndex) navigateTo(target, target > currentOpenIndex ? 1 : -1, true);
                else qnavJumpPanel.classList.remove("active");
            });
            document.addEventListener("click", (e) => {
                if (!qnavJumpPanel || !qnavJumpPanel.classList.contains("active")) return;
                if (qnavJumpPanel.contains(e.target) || (qnavJumpToggleBtn && qnavJumpToggleBtn.contains(e.target))) return;
                qnavJumpPanel.classList.remove("active");
            });
            questionGrid.addEventListener("click", (e) => {
                const selector = e.target.closest(".question-selector");
                if (!selector) return;
                const index = parseInt(selector.dataset.index, 10);
                if (selector.classList.contains("marked-for-review") || questionAnswers[index]) {
                    openQuestionModal(index);
                } else {
                    selector.classList.add("marked-for-review");
                    selector.classList.remove("bg-gray-800");
                }
            });
            function renderQuestionInto(index) {
                currentOpenIndex = index;
                const data = quizData[index];
                const prevAns = questionAnswers[index];
                let optionsHTML = data.options.map((opt, i) => {
                    const letter = String.fromCharCode(65 + i);
                    const optInner = '<span class="option-badge">' + letter + '</span><span class="option-text">' + (opt.text || "") + '</span>';
                    let extraCls = "";
                    if (prevAns) {
                        extraCls = " answered";
                        if (opt.isCorrect) extraCls += " correct";
                        else if (i === prevAns.selectedIndex) extraCls += " incorrect";
                    }
                    return "<div class=\"option p-5 md:p-6 my-4 rounded-xl border-2 border-transparent bg-gray-800 text-xl md:text-3xl shadow-lg" + extraCls + "\" data-index=\"" + i + "\" data-explanation=\"" + encodeURIComponent(opt.explanation || "") + "\">" + optInner + "</div>";
                }).join("");
                const imgHTML = data.image ? `<div class="my-4 flex justify-center"><img src="${data.image}" loading="lazy" tabindex="0" role="button" class="iqv-img question-image rounded-lg shadow-md border border-gray-700 hover:border-amber-500" alt="第${data.id}題 題目圖片" data-iqv-group="q-${data.id}" data-iqv-index="0" data-iqv-total="1" data-iqv-qlabel="第${data.id}題" aria-label="點擊放大檢視第${data.id}題圖片"></div>` : "";
                let badgeHTML = "";
                if (prevAns) { badgeHTML = prevAns.isCorrect ? '<div id="answer-result-badge" class="result-correct">✓ 答對</div>' : '<div id="answer-result-badge" class="result-incorrect">✕ 答錯</div>'; }
                modalContent.innerHTML = "<div class=\"space-y-6 md:space-y-8\"><div id=\"question-stem\" class=\"text-2xl md:text-4xl font-bold text-amber-300 tracking-wide border-l-4 border-amber-500 pl-4\">" + data.question + "</div>" + imgHTML + (data.reading || "") + "<div id=\"options-container\" class=\"mt-8\">" + optionsHTML + "</div>" + badgeHTML + "</div>";
                const optionsContainer = modalContent.querySelector("#options-container");
                optionsContainer.addEventListener("click", (e) => handleOptionClick(e, data, optionsContainer, index));
                updateFloatingNav(index);
                if (questionAnswers[index]) { updateGridButton(index); }
                else {
                    const gridBtn = document.querySelector(`.question-selector[data-index="${index}"]`);
                    if (gridBtn) { gridBtn.classList.add("marked-for-review"); gridBtn.classList.remove("bg-gray-800"); }
                }
                document.querySelectorAll(".question-selector").forEach((s) => s.classList.remove("ring-2", "ring-amber-400"));
                const cur = document.querySelector(`.question-selector[data-index="${index}"]`);
                if (cur) cur.classList.add("ring-2", "ring-amber-400");
            }
            function openQuestionModal(index) {
                renderQuestionInto(index);
                modal.classList.add("active");
                questionCard.scrollTop = 0;
                document.body.style.overflow = "hidden";
            }
            function handleOptionClick(e, data, container, index) {
                const clickedOption = e.target.closest(".option");
                if (!clickedOption) return;
                const clickedIdx = parseInt(clickedOption.dataset.index, 10);
                const allOptions = container.querySelectorAll(".option");
                if (!container.querySelector(".answered")) {
                    let isCorrect = false;
                    allOptions.forEach((opt, i) => {
                        opt.classList.add("answered");
                        if (data.options[i].isCorrect) opt.classList.add("correct");
                        else if (i === clickedIdx) opt.classList.add("incorrect");
                        if (i === clickedIdx && data.options[i].isCorrect) isCorrect = true;
                    });
                    questionAnswers[index] = { selectedIndex: clickedIdx, isCorrect: isCorrect };
                    updateGridButton(index);
                    const strip = document.getElementById("qnav-jump-strip");
                    if (strip) strip.innerHTML = buildJumpStripHTML(index);
                    let badge = document.getElementById("answer-result-badge");
                    if (!badge) {
                        badge = document.createElement("div");
                        badge.id = "answer-result-badge";
                        container.insertAdjacentElement("afterend", badge);
                    }
                    badge.className = isCorrect ? "result-correct" : "result-incorrect";
                    badge.textContent = isCorrect ? "✓ 答對" : "✕ 答錯";
                }
                const isSameTarget = explanationBubble.classList.contains("active") && explanationBubble.dataset.qIndex === String(index) && explanationBubble.dataset.oIndex === String(clickedIdx);
                if (isSameTarget) {
                    explanationBubble.classList.remove("active");
                } else {
                    showExplanationBubble(clickedOption, index, clickedIdx);
                }
            }
            function showExplanationBubble(targetElement, qIndex, oIndex) {
                const exp = decodeURIComponent(targetElement.dataset.explanation || "");
                if(!exp || exp === "undefined" || exp.trim() === "") { 
                    explanationBubble.classList.remove("active"); 
                    return; 
                }
                explanationBubble.dataset.qIndex = String(qIndex);
                explanationBubble.dataset.oIndex = String(oIndex);
                explanationBubble.innerHTML = exp;
                explanationBubble.style.visibility = "hidden";
                explanationBubble.classList.add("active");
                const rect = targetElement.getBoundingClientRect();
                const bubbleHeight = explanationBubble.offsetHeight;
                const bubbleWidth = explanationBubble.offsetWidth;
                let topPos = rect.bottom + 15;
                let leftPos = rect.left + (rect.width / 2) - (bubbleWidth / 2);
                if (leftPos + bubbleWidth > window.innerWidth - 20) leftPos = window.innerWidth - bubbleWidth - 20;
                if (leftPos < 20) leftPos = 20;
                if (topPos + bubbleHeight > window.innerHeight - 20) {
                    topPos = rect.top - bubbleHeight - 15;
                    if (topPos < 20) {
                        topPos = window.innerHeight - bubbleHeight - 20;
                        explanationBubble.classList.remove("arrow-bottom", "arrow-top");
                    } else {
                        explanationBubble.classList.add("arrow-bottom");
                        explanationBubble.classList.remove("arrow-top");
                    }
                } else {
                    explanationBubble.classList.add("arrow-top");
                    explanationBubble.classList.remove("arrow-bottom");
                }
                explanationBubble.style.top = topPos + "px";
                explanationBubble.style.left = leftPos + "px";
                explanationBubble.style.visibility = "visible";
            }
            const closeModal = () => {
                modal.classList.remove("active");
                explanationBubble.classList.remove("active");
                if (qnavJumpPanel) qnavJumpPanel.classList.remove("active");
                document.body.style.overflow = "";
                document.querySelectorAll(".question-selector").forEach((s) => s.classList.remove("ring-2", "ring-amber-400"));
                if (currentOpenIndex !== null) {
                    const idx = currentOpenIndex;
                    if (questionAnswers[idx]) {
                        updateGridButton(idx);
                    } else {
                        const selector = document.querySelector(`.question-selector[data-index="${idx}"]`);
                        if (selector && selector.classList.contains("marked-for-review")) {
                            selector.classList.remove("marked-for-review");
                            selector.classList.add("bg-gray-800");
                            selector.style.opacity = "0.5";
                        }
                    }
                }
                currentOpenIndex = null;
            };
            document.addEventListener("keydown", (e) => {
                if (!modal.classList.contains("active")) return;
                const tag = (e.target && e.target.tagName || "").toLowerCase();
                if (tag === "input" || tag === "textarea" || (e.target && e.target.isContentEditable)) return;
                if (e.key === "ArrowLeft") { e.preventDefault(); if (currentOpenIndex > 0) navigateTo(currentOpenIndex - 1, -1); }
                else if (e.key === "ArrowRight") { e.preventDefault(); if (currentOpenIndex < quizData.length - 1) navigateTo(currentOpenIndex + 1, 1); }
                else if (e.key === "Escape") { if (qnavJumpPanel && qnavJumpPanel.classList.contains("active")) qnavJumpPanel.classList.remove("active"); else closeModal(); }
            });
            const closeFullscreen = () => { fullscreenModal.classList.remove("active"); document.body.style.overflow = ""; };
            closeModalBtn.addEventListener("click", closeModal);
            modal.addEventListener("click", (e) => { if (e.target === modal) closeModal(); });
            closeFullscreenBtn.addEventListener("click", closeFullscreen);
            fullscreenModal.addEventListener("click", (e) => { if (e.target === fullscreenModal) closeFullscreen(); });
            document.body.addEventListener("click", (e) => {
                const expandable = e.target.closest(".expandable-text");
                if (expandable) {
                    fullscreenContent.innerHTML = expandable.innerHTML;
                    fullscreenModal.classList.add("active");
                    document.body.style.overflow = "hidden";
                }
            });
            const fsBtn = document.getElementById("browser-fullscreen-btn");
            fsBtn.addEventListener("click", () => {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen().then(() => {
                        fsBtn.innerHTML = "❌ 退出全螢幕";
                        fsBtn.classList.replace("bg-amber-600/90", "bg-red-600/90");
                    }).catch(err => { console.warn("無法切換全螢幕"); });
                } else { document.exitFullscreen(); }
            });
            document.addEventListener("fullscreenchange", () => {
                if (!document.fullscreenElement) {
                    fsBtn.innerHTML = "🖥️ 進入全螢幕投影";
                    fsBtn.classList.replace("bg-red-600/90", "bg-amber-600/90");
                }
            });
            setTimeout(() => { document.querySelectorAll(".initial-hidden").forEach((el, i) => { setTimeout(() => el.classList.add("fade-in-up"), i * 200); }); }, 100);
            if (window.ReviewAppearance) window.ReviewAppearance.init();
        });
    </script>
    <script>
/* ================================================================
   AppearanceSettings（獨立生成頁專用）— 背景圖片 / 透明度 / 模糊
   本頁為離線可攜的獨立 HTML 檔案，無法存取編輯器的 IndexedDB，
   因此使用自己的一組極簡 IndexedDB（ExamReviewAppearanceDB）儲存設定，
   不影響、不重複編輯器既有的 Database / ProjectStorage 架構。
   ================================================================ */
(function (global) {
    "use strict";

    var DB_NAME = "ExamReviewAppearanceDB";
    var STORE = "kv";
    var KEY = "appearance";
    var MAX_DIMENSION = 1920;
    var dbPromise = null;

    var DEFAULTS = { backgroundImage: null, backgroundOpacity: 100, backgroundBlur: 0, cardOpacity: 70 };
    var current = Object.assign({}, DEFAULTS);

    function openDB() {
        if (dbPromise) return dbPromise;
        dbPromise = new Promise(function (resolve, reject) {
            if (!("indexedDB" in global)) { reject(new Error("此瀏覽器不支援 IndexedDB")); return; }
            var req = indexedDB.open(DB_NAME, 1);
            req.onupgradeneeded = function (e) {
                var db = e.target.result;
                if (!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE, { keyPath: "key" });
            };
            req.onsuccess = function (e) { resolve(e.target.result); };
            req.onerror = function (e) { reject(e.target.error); };
        });
        return dbPromise;
    }

    function getSetting() {
        return openDB().then(function (db) {
            return new Promise(function (resolve) {
                var tx = db.transaction(STORE, "readonly");
                var req = tx.objectStore(STORE).get(KEY);
                req.onsuccess = function () { resolve(req.result ? req.result.value : null); };
                req.onerror = function () { resolve(null); };
            });
        }).catch(function () { return null; });
    }

    function setSetting(value) {
        return openDB().then(function (db) {
            return new Promise(function (resolve, reject) {
                var tx = db.transaction(STORE, "readwrite");
                tx.objectStore(STORE).put({ key: KEY, value: value });
                tx.oncomplete = function () { resolve(true); };
                tx.onerror = function (e) { reject(e.target.error); };
            });
        });
    }

    function el(id) { return document.getElementById(id); }

    function applyToDOM() {
        var root = document.documentElement;
        root.style.setProperty("--bg-opacity", (current.backgroundOpacity / 100).toString());
        root.style.setProperty("--bg-blur", current.backgroundBlur + "px");
        root.style.setProperty("--card-opacity", (current.cardOpacity / 100).toString());
        var layer = el("review-bg-layer");
        if (layer && current.backgroundImage) layer.style.backgroundImage = 'url("' + current.backgroundImage + '")';
        else if (layer) layer.style.backgroundImage = "";
    }

    function refreshUI() {
        var preview = el("appearance-preview");
        if (preview) {
            if (current.backgroundImage) preview.style.backgroundImage = 'url("' + current.backgroundImage + '")';
            else preview.style.backgroundImage = "none";
        }
        var pairs = [["appearance-bg-opacity", "appearance-bg-opacity-val", "%"], ["appearance-bg-blur", "appearance-bg-blur-val", "px"], ["appearance-card-opacity", "appearance-card-opacity-val", "%"]];
        var keys = { "appearance-bg-opacity": "backgroundOpacity", "appearance-bg-blur": "backgroundBlur", "appearance-card-opacity": "cardOpacity" };
        pairs.forEach(function (p) {
            var input = el(p[0]), label = el(p[1]);
            var val = current[keys[p[0]]];
            if (input) input.value = val;
            if (label) label.textContent = val + p[2];
        });
    }

    function compressImage(file) {
        return new Promise(function (resolve, reject) {
            var reader = new FileReader();
            reader.onerror = function () { reject(new Error("讀取失敗")); };
            reader.onload = function () {
                var img = new Image();
                img.onerror = function () { reject(new Error("圖片格式錯誤")); };
                img.onload = function () {
                    var scale = Math.min(1, MAX_DIMENSION / Math.max(img.naturalWidth, img.naturalHeight));
                    var cw = Math.max(1, Math.round(img.naturalWidth * scale));
                    var ch = Math.max(1, Math.round(img.naturalHeight * scale));
                    var canvas = document.createElement("canvas");
                    canvas.width = cw; canvas.height = ch;
                    canvas.getContext("2d").drawImage(img, 0, 0, cw, ch);
                    resolve(canvas.toDataURL("image/jpeg", 0.82));
                };
                img.src = reader.result;
            };
            reader.readAsDataURL(file);
        });
    }

    function bindEvents() {
        var toggleBtn = el("appearance-toggle-btn");
        var panel = el("appearance-panel");
        var closeBtn = el("appearance-panel-close");
        var fileInput = el("appearance-file-input");
        var uploadBtn = el("appearance-upload-btn");
        var removeBtn = el("appearance-remove-btn");
        var resetBtn = el("appearance-reset-btn");

        if (toggleBtn && panel) toggleBtn.addEventListener("click", function () { panel.classList.toggle("active"); });
        if (closeBtn && panel) closeBtn.addEventListener("click", function () { panel.classList.remove("active"); });
        document.addEventListener("click", function (e) {
            if (!panel || !panel.classList.contains("active")) return;
            if (panel.contains(e.target) || (toggleBtn && toggleBtn.contains(e.target))) return;
            panel.classList.remove("active");
        });
        if (uploadBtn && fileInput) uploadBtn.addEventListener("click", function () { fileInput.click(); });
        if (fileInput) fileInput.addEventListener("change", function (e) {
            var file = e.target.files && e.target.files[0];
            if (!file) return;
            if (!/^image\/(png|jpeg|webp)$/.test(file.type)) { if (window.showToast) showToast("僅支援 JPG / PNG / WEBP"); fileInput.value = ""; return; }
            compressImage(file).then(function (dataUrl) {
                current.backgroundImage = dataUrl;
                applyToDOM(); refreshUI();
                return setSetting(current);
            }).then(function () { if (window.showToast) showToast("背景已套用"); })
              .catch(function (err) { if (window.showToast) showToast("圖片處理失敗：" + err.message); });
            fileInput.value = "";
        });
        if (removeBtn) removeBtn.addEventListener("click", function () {
            current.backgroundImage = null;
            applyToDOM(); refreshUI();
            setSetting(current);
        });
        if (resetBtn) resetBtn.addEventListener("click", function () {
            if (!confirm("確定恢復預設外觀設定嗎？")) return;
            current = Object.assign({}, DEFAULTS);
            applyToDOM(); refreshUI();
            setSetting(current);
        });
        ["appearance-bg-opacity", "appearance-bg-blur", "appearance-card-opacity"].forEach(function (id) {
            var input = el(id);
            if (!input) return;
            var keyMap = { "appearance-bg-opacity": "backgroundOpacity", "appearance-bg-blur": "backgroundBlur", "appearance-card-opacity": "cardOpacity" };
            input.addEventListener("input", function () {
                current[keyMap[id]] = parseInt(input.value, 10);
                applyToDOM(); refreshUI();
            });
            input.addEventListener("change", function () { setSetting(current); });
        });
        document.addEventListener("keydown", function (e) {
            if (e.key === "Escape" && panel && panel.classList.contains("active")) panel.classList.remove("active");
        });
    }

    global.ReviewAppearance = {
        init: function () {
            getSetting().then(function (saved) {
                current = Object.assign({}, DEFAULTS, saved || {});
                applyToDOM(); refreshUI(); bindEvents();
            }).catch(function () { applyToDOM(); bindEvents(); });
        }
    };
})(window);
    </script>
    <script>
/* ================================================================
   ImageViewer.js — 專業圖片瀏覽器核心引擎
   ================================================================ */
(function () {
    "use strict";

    var ZOOM_LEVELS = [100, 150, 200, 300, 400, 500];

    function ImageViewer() {
        this.zoom = 100;
        this.tx = 0;
        this.ty = 0;
        this.group = [];
        this.index = 0;
        this.isOpen = false;
        this.readingOn = false;
        this.isDragging = false;
        this.dragStart = null;
        this.startTx = 0;
        this.startTy = 0;
        this.pinchStartDist = null;
        this.pinchStartZoom = 100;

    ImageViewer.prototype.build = function () {

        var overlay = document.createElement("div");

        overlay.className = "iqv-overlay";
        overlay.setAttribute("role", "dialog");
        overlay.setAttribute("aria-modal", "true");
        overlay.setAttribute("aria-label", "圖片檢視器");

        overlay.innerHTML =
            '<div class="iqv-info-topleft" id="iqv-info-topleft" aria-live="polite"></div>' +
            '<div class="iqv-toolbar">' +
            '<button type="button" class="iqv-btn" id="iqv-reading-btn" aria-pressed="false" aria-label="切換閱讀模式" title="閱讀模式"><i class="fa-solid fa-circle-half-stroke" aria-hidden="true"></i></button>' +
            '<button type="button" class="iqv-btn" id="iqv-reset-btn" aria-label="重置檢視" title="重置 (0)"><i class="fa-solid fa-arrows-rotate" aria-hidden="true"></i></button>' +
            '<button type="button" class="iqv-btn" id="iqv-fullscreen-btn" aria-label="切換全螢幕" title="全螢幕 (F)"><i class="fa-solid fa-expand" aria-hidden="true"></i></button>' +
            '<button type="button" class="iqv-btn iqv-close" id="iqv-close-btn" aria-label="關閉檢視器" title="關閉 (Esc)">&times;</button>' +
            '</div>' +
            '<button type="button" class="iqv-nav iqv-prev" id="iqv-prev-btn" aria-label="上一張圖片" title="上一張 (←)"><i class="fa-solid fa-chevron-left" aria-hidden="true"></i></button>' +
            '<div class="iqv-stage" id="iqv-stage">' +
            '<div class="iqv-image-wrap" id="iqv-image-wrap"><img id="iqv-image" class="iqv-image" alt="" draggable="false"></div>' +
            '</div>' +
            '<button type="button" class="iqv-nav iqv-next" id="iqv-next-btn" aria-label="下一張圖片" title="下一張 (→)"><i class="fa-solid fa-chevron-right" aria-hidden="true"></i></button>' +
            '<div class="iqv-info-bottomright" id="iqv-info-bottomright"></div>' +
            '<div class="iqv-thumbstrip" id="iqv-thumbstrip"></div>';

        document.body.appendChild(overlay);

        this.overlay = overlay;
        this.stage = overlay.querySelector("#iqv-stage");
        this.imageWrap = overlay.querySelector("#iqv-image-wrap");
        this.imageEl = overlay.querySelector("#iqv-image");
        this.topLeftEl = overlay.querySelector("#iqv-info-topleft");
        this.bottomRightEl = overlay.querySelector("#iqv-info-bottomright");
        this.thumbstrip = overlay.querySelector("#iqv-thumbstrip");
        this.prevBtn = overlay.querySelector("#iqv-prev-btn");
        this.nextBtn = overlay.querySelector("#iqv-next-btn");
        this.closeBtn = overlay.querySelector("#iqv-close-btn");
        this.resetBtn = overlay.querySelector("#iqv-reset-btn");
        this.readingBtn = overlay.querySelector("#iqv-reading-btn");
        this.fsBtn = overlay.querySelector("#iqv-fullscreen-btn");

        this.closeBtn.addEventListener("click", function () { self.close(); });
        this.resetBtn.addEventListener("click", function () { self.reset(); });
        this.readingBtn.addEventListener("click", function () { self.toggleReading(); });
        this.fsBtn.addEventListener("click", function () { self.toggleFullscreen(); });
        this.prevBtn.addEventListener("click", function () { self.prev(); });
        this.nextBtn.addEventListener("click", function () { self.next(); });

        overlay.addEventListener("mousedown", function (e) {
            if (e.target === overlay) self.close();
        });

        this.stage.addEventListener("wheel", function (e) {
            e.preventDefault();
            self.stepZoom(e.deltaY < 0 ? 1 : -1);
        }, { passive: false });

        this.imageEl.addEventListener("dblclick", function (e) {
            e.preventDefault();
            self.toggleDoubleZoom();
        });

        this.imageEl.addEventListener("mousedown", function (e) {
            if (self.zoom <= 100) return;
            self.isDragging = true;
            self.dragStart = { x: e.clientX, y: e.clientY };
            self.startTx = self.tx;
            self.startTy = self.ty;
            self.imageEl.classList.add("iqv-dragging");
            e.preventDefault();
        });
        document.addEventListener("mousemove", function (e) {
            if (!self.isDragging) return;
            var dx = e.clientX - self.dragStart.x;
            var dy = e.clientY - self.dragStart.y;
            self.tx = self.startTx + dx;
            self.ty = self.startTy + dy;
            self.clampTranslate();
            self.applyTransform();
        });
        document.addEventListener("mouseup", function () {
            if (!self.isDragging) return;
            self.isDragging = false;
            self.imageEl.classList.remove("iqv-dragging");
        });

        this.stage.addEventListener("touchstart", function (e) {
            if (e.touches.length === 2) {
                self.pinchStartDist = self._touchDist(e.touches);
                self.pinchStartZoom = self.zoom;
            } else if (e.touches.length === 1) {
                self.isDragging = self.zoom > 100;
                self.dragStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
                self.startTx = self.tx;
                self.startTy = self.ty;
                var now = Date.now();
                if (now - self.lastTapTime < 300) {
                    self.toggleDoubleZoom();
                }
                self.lastTapTime = now;
            }
        }, { passive: true });

        this.stage.addEventListener("touchmove", function (e) {
            if (e.touches.length === 2 && self.pinchStartDist) {
                var dist = self._touchDist(e.touches);
                var ratio = dist / self.pinchStartDist;
                var newZoom = Math.round(self.pinchStartZoom * ratio);
                newZoom = Math.min(500, Math.max(100, newZoom));
                self.zoom = newZoom;
                self.clampTranslate();
                self.applyTransform();
                self.updateInfo();
                e.preventDefault();
            } else if (e.touches.length === 1 && self.isDragging) {
                var dx = e.touches[0].clientX - self.dragStart.x;
                var dy = e.touches[0].clientY - self.dragStart.y;
                self.tx = self.startTx + dx;
                self.ty = self.startTy + dy;
                self.clampTranslate();
                self.applyTransform();
                e.preventDefault();
            }
        }, { passive: false });

        this.stage.addEventListener("touchend", function () {
            self.pinchStartDist = null;
            self.isDragging = false;
        });

        document.addEventListener("keydown", function (e) {
            if (!self.isOpen) return;
            if (e.key === "Escape") { self.close(); }
            else if (e.key === "ArrowLeft") { self.prev(); }
            else if (e.key === "ArrowRight") { self.next(); }
            else if (e.key === "+" || e.key === "=") { self.stepZoom(1); }
            else if (e.key === "-" || e.key === "_") { self.stepZoom(-1); }
            else if (e.key === "0") { self.reset(); }
            else if (e.key === "f" || e.key === "F") { self.toggleFullscreen(); }
            else if (e.key === "Tab") { self._trapFocus(e); }
        });

        window.addEventListener("resize", function () {
            if (!self.isOpen) return;
            self.clampTranslate();
            self.applyTransform();
        });

        this.built = true;
    };

    ImageViewer.prototype._touchDist = function (touches) {
        var dx = touches[0].clientX - touches[1].clientX;
        var dy = touches[0].clientY - touches[1].clientY;
        return Math.sqrt(dx * dx + dy * dy);
    };

    ImageViewer.prototype._trapFocus = function (e) {
        var focusable = this.overlay.querySelectorAll('button, [tabindex]:not([tabindex="-1"])');
        if (!focusable.length) return;
        var first = focusable[0];
        var last = focusable[focusable.length - 1];
        if (e.shiftKey && document.activeElement === first) {
            e.preventDefault();
            last.focus();
        } else if (!e.shiftKey && document.activeElement === last) {
            e.preventDefault();
            first.focus();
        }
    };

    ImageViewer.prototype.open = function (group, index) {
        this.build();
        this.group = group;
        this.index = index || 0;
        this.isOpen = true;
        this._savedFocus = document.activeElement;
        this.overlay.style.display = "flex";
        document.body.style.overflow = "hidden";
        this.renderCurrent();
        var self = this;
        requestAnimationFrame(function () {
            self.overlay.classList.add("iqv-active");
        });
        this.closeBtn.focus();
    };

    ImageViewer.prototype.close = function () {
        if (!this.isOpen) return;
        this.isOpen = false;
        this.overlay.classList.remove("iqv-active");
        if (document.fullscreenElement) {
            document.exitFullscreen && document.exitFullscreen().catch(function () { });
        }
        var self = this;
        clearTimeout(this.closeTimer);
        this.closeTimer = setTimeout(function () {
            self.overlay.style.display = "none";
        }, 300);
        document.body.style.overflow = "";
        if (this._savedFocus && this._savedFocus.focus) {
            this._savedFocus.focus();
        }
    };

    ImageViewer.prototype.renderCurrent = function () {
        var item = this.group[this.index];
        this.zoom = 100;
        this.tx = 0;
        this.ty = 0;
        this.applyTransform();
        this.imageEl.src = item.src;
        this.imageEl.alt = item.caption || "題目圖片";
        this.imageEl.style.cursor = "zoom-in";
        var self = this;
        this.imageEl.onload = function () {
            self.updateInfo();
        };
        this.updateTopLeft();
        this.updateInfo();
        this.updateThumbnails();
        var multi = this.group.length > 1;
        this.prevBtn.style.display = multi ? "" : "none";
        this.nextBtn.style.display = multi ? "" : "none";
        this.thumbstrip.style.display = multi ? "" : "none";
    };

    ImageViewer.prototype.prev = function () {
        if (this.group.length <= 1) return;
        this.index = (this.index - 1 + this.group.length) % this.group.length;
        this.renderCurrent();
    };

    ImageViewer.prototype.next = function () {
        if (this.group.length <= 1) return;
        this.index = (this.index + 1) % this.group.length;
        this.renderCurrent();
    };

    ImageViewer.prototype.goTo = function (i) {
        if (i === this.index) return;
        this.index = i;
        this.renderCurrent();
    };

    ImageViewer.prototype.stepZoom = function (dir) {
        var idx = ZOOM_LEVELS.indexOf(this.zoom);
        if (idx === -1) {
            var best = Infinity;
            idx = 0;
            for (var i = 0; i < ZOOM_LEVELS.length; i++) {
                var d = Math.abs(ZOOM_LEVELS[i] - this.zoom);
                if (d < best) { best = d; idx = i; }
            }
        }
        idx = Math.min(ZOOM_LEVELS.length - 1, Math.max(0, idx + dir));
        this.setZoom(ZOOM_LEVELS[idx]);
    };

    ImageViewer.prototype.setZoom = function (z) {
        this.zoom = z;
        if (z <= 100) { this.tx = 0; this.ty = 0; }
        this.clampTranslate();
        this.applyTransform();
        this.updateInfo();
        this.imageEl.style.cursor = z > 100 ? "grab" : "zoom-in";
    };

    ImageViewer.prototype.toggleDoubleZoom = function () {
        if (this.zoom > 100) { this.setZoom(100); }
        else { this.setZoom(250); }
    };

    ImageViewer.prototype.applyTransform = function () {
        this.imageEl.style.transform = "translate(" + this.tx + "px," + this.ty + "px) scale(" + (this.zoom / 100) + ")";
    };

    ImageViewer.prototype.clampTranslate = function () {
        if (this.zoom <= 100) { this.tx = 0; this.ty = 0; return; }
        var stageRect = this.stage.getBoundingClientRect();
        var w = this.imageEl.offsetWidth * (this.zoom / 100);
        var h = this.imageEl.offsetHeight * (this.zoom / 100);
        var maxX = Math.max(0, (w - stageRect.width) / 2);
        var maxY = Math.max(0, (h - stageRect.height) / 2);
        this.tx = Math.min(maxX, Math.max(-maxX, this.tx));
        this.ty = Math.min(maxY, Math.max(-maxY, this.ty));
    };

    ImageViewer.prototype.reset = function () {
        this.zoom = 100;
        this.tx = 0;
        this.ty = 0;
        this.applyTransform();
        this.updateInfo();
        if (this.imageEl) this.imageEl.style.cursor = "zoom-in";
    };

    ImageViewer.prototype.toggleReading = function () {
        this.readingOn = !this.readingOn;
        this.imageEl.classList.toggle("iqv-reading", this.readingOn);
        this.readingBtn.setAttribute("aria-pressed", this.readingOn ? "true" : "false");
    };

    ImageViewer.prototype.toggleFullscreen = function () {
        if (!document.fullscreenElement) {
            this.overlay.requestFullscreen && this.overlay.requestFullscreen().catch(function () { });
        } else {
            document.exitFullscreen && document.exitFullscreen();
        }
    };

    ImageViewer.prototype._gcd = function (a, b) {
        return b === 0 ? a : this._gcd(b, a % b);
    };

    ImageViewer.prototype.updateTopLeft = function () {
        var item = this.group[this.index];
        var html = "";
        if (item.qlabel) html += "<div>" + item.qlabel + "</div>";
        if (this.group.length > 1) {
            html += '<div style="font-size:12px;color:#9ca3af;margin-top:2px;">圖片' + (this.index + 1) + "/" + this.group.length + "</div>";
        }
        this.topLeftEl.innerHTML = html;
    };

    ImageViewer.prototype.updateInfo = function () {
        var w = this.imageEl.naturalWidth || 0;
        var h = this.imageEl.naturalHeight || 0;
        var ratioText = "";
        if (w && h) {
            var g = this._gcd(w, h);
            ratioText = (w / g) + ":" + (h / g);
        }
        this.bottomRightEl.textContent = (w && h ? (w + " × " + h + "px  |  " + ratioText + "  |  ") : "") + this.zoom + "%";
    };

    ImageViewer.prototype.updateThumbnails = function () {
        var strip = this.thumbstrip;
        strip.innerHTML = "";
        if (this.group.length <= 1) return;
        var self = this;
        this.group.forEach(function (item, i) {
            var t = document.createElement("img");
            t.src = item.src;
            t.loading = "lazy";
            t.className = "iqv-thumb" + (i === self.index ? " iqv-thumb-active" : "");
            t.alt = "圖片" + (i + 1);
            t.tabIndex = 0;
            t.setAttribute("role", "button");
            t.setAttribute("aria-label", "切換至圖片" + (i + 1) + "/" + self.group.length);
            t.addEventListener("click", function () { self.goTo(i); });
            t.addEventListener("keydown", function (e) {
                if (e.key === "Enter" || e.key === " ") { e.preventDefault(); self.goTo(i); }
            });
            strip.appendChild(t);
        });
    };

    /* ================================================================
       ImageViewerManager.js — 圖片掃描 / 事件委派 / 延遲初始化
       ================================================================ */
    function ImageViewerManager() {
        this.viewer = new ImageViewer();
        var self = this;

        document.addEventListener("click", function (e) {
            var trigger = e.target.closest && e.target.closest(".iqv-img");
            if (!trigger) return;
            e.preventDefault();
            self.openFromImage(trigger);
        });

        document.addEventListener("keydown", function (e) {
            var active = document.activeElement;
            if (!active || !active.classList || !active.classList.contains("iqv-img")) return;
            if (e.key === "Enter" || e.key === " ") {
                e.preventDefault();
                self.openFromImage(active);
            }
        });
    }

    ImageViewerManager.prototype.collectGroup = function (img) {
        var groupId = img.getAttribute("data-iqv-group") || ("solo-" + Math.random().toString(36).slice(2));
        var all = document.querySelectorAll(".iqv-img");
        var nodes = [];
        for (var i = 0; i < all.length; i++) {
            if (all[i].getAttribute("data-iqv-group") === groupId) nodes.push(all[i]);
        }
        if (!nodes.length) nodes = [img];
        nodes.sort(function (a, b) {
            return (parseInt(a.getAttribute("data-iqv-index") || "0", 10)) - (parseInt(b.getAttribute("data-iqv-index") || "0", 10));
        });
        return nodes;
    };

    ImageViewerManager.prototype.openFromImage = function (img) {
        var nodes = this.collectGroup(img);
        var group = nodes.map(function (n) {
            return {
                src: n.getAttribute("src"),
                caption: n.getAttribute("alt") || "",
                qlabel: n.getAttribute("data-iqv-qlabel") || ""
            };
        });
        var idx = nodes.indexOf(img);
        if (idx < 0) idx = 0;
        this.viewer.open(group, idx);
    };

    // 效能：不在頁面載入時建立 DOM，僅在第一次點擊圖片時才初始化 Viewer 本體
    window.__iqvManager = new ImageViewerManager();
})();
    </script>
